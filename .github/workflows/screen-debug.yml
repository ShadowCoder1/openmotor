# Temporary (2026-11-12): show why the finder's screening call fails on the runner. Delete after use.
name: Screen debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g --silent @anthropic-ai/claude-code@2.1.311 && claude --version
      - name: One screening call on a made-up candidate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_UPDATES: "1"
        run: |
          python -I -c "
          import sys; sys.path.insert(0, 'tools/finder'); import screen
          c = {'cid': 'x1', 'title': 'Visuomotor adaptation in healthy adults', 'abstract': 'Participants reached to targets under a 30 degree rotation. Data are on OSF.', 'data_url': 'https://osf.io/abcde', 'host': 'OSF'}
          for m in ('claude-haiku-5-5', 'claude-sonnet-5-5'):
              ans, cost, err = screen.call_claude(m, [c], 'claude')
              print(m, 'answer:', bool(ans), 'cost', cost, 'error:', err[:400])
          "
          echo "--- same call, scrub off:"
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB= python -I -c "
          import sys, os; os.environ.pop('CLAUDE_CODE_SUBPROCESS_ENV_SCRUB', None); sys.path.insert(0, 'tools/finder'); import screen
          screen.os.environ.pop('CLAUDE_CODE_SUBPROCESS_ENV_SCRUB', None)
          c = {'cid': 'x1', 'title': 'Visuomotor adaptation', 'abstract': 'Reaching under rotation.', 'data_url': 'https://osf.io/abcde', 'host': 'OSF'}
          print(screen.call_claude('claude-haiku-5-5', [c], 'claude')[2][:400])
          "
          echo "--- plain prompt as an argument:"
          cd "$(mktemp -d)" && claude -p "Reply with the word ok." --model claude-haiku-5-5 --output-format json --max-turns 2 2>&1 | head -c 600
